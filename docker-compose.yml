# ============================================================
# 3DS Anomaly Detection System — Docker Compose
# Single-host MVP deployment
#
# Usage:
#   docker compose up --build
#
# No manual SQL, no manual migration, no manual model training.
# Everything initialises automatically on first startup:
#   1. PostgreSQL runs init.sql (creates ALL tables + seeds 100 profiles)
#   2. Scoring engine startup.py runs:
#      - Verifies / creates any missing tables
#      - Seeds profiles if empty
#      - Trains Isolation Forest model if missing
#   3. Uvicorn starts serving on :8000
#   4. API Gateway starts on :3000
# ============================================================

services:

  # --- PostgreSQL ---
  postgres:
    image: postgres:16-alpine
    container_name: anomaly-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: anomaly_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d anomaly_db"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # --- FastAPI Scoring Engine ---
  scoring-engine:
    build:
      context: ./scoring-engine
      dockerfile: Dockerfile
    container_name: anomaly-scoring
    ports:
      - "8000:8000"
    environment:
      MODEL_PATH: /app/model/isolation_forest.pkl
      PG_DSN: postgresql://postgres:postgres@postgres:5432/anomaly_db
      # Redis is optional — engine falls back to in-memory if not available
      REDIS_URL: redis://localhost:6379
    volumes:
      # model dir is read-write so startup.py can train & save the model
      - model_data:/app/model
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  # --- Node.js API Gateway ---
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: anomaly-gateway
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      SCORING_ENGINE_URL: http://scoring-engine:8000
      API_KEY: dev-api-key-change-in-production
    depends_on:
      scoring-engine:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pg_data:
  model_data:
